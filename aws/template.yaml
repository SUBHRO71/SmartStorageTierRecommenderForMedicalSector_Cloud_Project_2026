{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "CloudTier v2 study archive research pilot",
  "Parameters": {
    "VpcId": {
      "Type": "AWS::EC2::VPC::Id"
    },
    "SubnetId": {
      "Type": "AWS::EC2::Subnet::Id"
    },
    "ArtifactBucket": {
      "Type": "String"
    },
    "ReleaseKey": {
      "Type": "String"
    },
    "InstanceType": {
      "Type": "String",
      "Default": "m7i-flex.large",
      "AllowedValues": [
        "m7i-flex.large",
        "c7i-flex.large"
      ]
    },
    "AmiId": {
      "Type": "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>",
      "Default": "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
    },
    "NotificationEmail": {
      "Type": "String",
      "Default": ""
    }
  },
  "Conditions": {
    "HasEmail": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "NotificationEmail"
            },
            ""
          ]
        }
      ]
    }
  },
  "Resources": {
    "ArchiveBucket": {
      "Type": "AWS::S3::Bucket",
      "Properties": {
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              }
            }
          ]
        },
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "BlockPublicPolicy": true,
          "IgnorePublicAcls": true,
          "RestrictPublicBuckets": true
        },
        "VersioningConfiguration": {
          "Status": "Enabled"
        },
        "LifecycleConfiguration": {
          "Rules": [
            {
              "Id": "STANDARD_IA",
              "Status": "Enabled",
              "Prefix": "studies/",
              "TagFilters": [
                {
                  "Key": "tier",
                  "Value": "STANDARD_IA"
                }
              ],
              "Transitions": [
                {
                  "StorageClass": "STANDARD_IA",
                  "TransitionInDays": 30
                }
              ]
            },
            {
              "Id": "GLACIER",
              "Status": "Enabled",
              "Prefix": "studies/",
              "TagFilters": [
                {
                  "Key": "tier",
                  "Value": "GLACIER"
                }
              ],
              "Transitions": [
                {
                  "StorageClass": "GLACIER",
                  "TransitionInDays": 0
                }
              ]
            },
            {
              "Id": "DEEP_ARCHIVE",
              "Status": "Enabled",
              "Prefix": "studies/",
              "TagFilters": [
                {
                  "Key": "tier",
                  "Value": "DEEP_ARCHIVE"
                }
              ],
              "Transitions": [
                {
                  "StorageClass": "DEEP_ARCHIVE",
                  "TransitionInDays": 0
                }
              ]
            },
            {
              "Id": "IncompleteUploads",
              "Status": "Enabled",
              "AbortIncompleteMultipartUpload": {
                "DaysAfterInitiation": 1
              }
            },
            {
              "Id": "OldCatalogBackups",
              "Status": "Enabled",
              "Prefix": "backups/",
              "ExpirationInDays": 30,
              "NoncurrentVersionExpiration": {
                "NoncurrentDays": 30
              }
            },
            {
              "Id": "StagedUploads",
              "Status": "Enabled",
              "Prefix": "staging/",
              "ExpirationInDays": 1,
              "NoncurrentVersionExpiration": {
                "NoncurrentDays": 1
              }
            }
          ]
        },
        "CorsConfiguration": {
          "CorsRules": [
            {
              "AllowedOrigins": [
                "*"
              ],
              "AllowedMethods": [
                "PUT",
                "HEAD"
              ],
              "AllowedHeaders": [
                "content-type"
              ],
              "MaxAge": 3600
            }
          ]
        }
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "ArchiveBucketPolicy": {
      "Type": "AWS::S3::BucketPolicy",
      "Properties": {
        "Bucket": {
          "Ref": "ArchiveBucket"
        },
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:*",
              "Resource": [
                {
                  "Fn::GetAtt": [
                    "ArchiveBucket",
                    "Arn"
                  ]
                },
                {
                  "Fn::Sub": "${ArchiveBucket.Arn}/*"
                }
              ],
              "Condition": {
                "Bool": {
                  "aws:SecureTransport": "false"
                }
              }
            }
          ]
        }
      }
    },
    "UserPool": {
      "Type": "AWS::Cognito::UserPool",
      "Properties": {
        "UserPoolName": {
          "Fn::Sub": "${AWS::StackName}-users"
        },
        "AdminCreateUserConfig": {
          "AllowAdminCreateUserOnly": true
        },
        "AliasAttributes": [
          "email"
        ],
        "AutoVerifiedAttributes": [
          "email"
        ],
        "UserPoolTier": "LITE",
        "Policies": {
          "PasswordPolicy": {
            "MinimumLength": 14,
            "RequireLowercase": true,
            "RequireNumbers": true,
            "RequireSymbols": true,
            "RequireUppercase": true
          }
        }
      }
    },
    "UserPoolClient": {
      "Type": "AWS::Cognito::UserPoolClient",
      "Properties": {
        "UserPoolId": {
          "Ref": "UserPool"
        },
        "GenerateSecret": false,
        "ExplicitAuthFlows": [
          "ALLOW_USER_SRP_AUTH",
          "ALLOW_REFRESH_TOKEN_AUTH",
          "ALLOW_ADMIN_USER_PASSWORD_AUTH"
        ],
        "PreventUserExistenceErrors": "ENABLED",
        "AccessTokenValidity": 1,
        "IdTokenValidity": 1,
        "RefreshTokenValidity": 1
      }
    },
    "ViewerGroup": {
      "Type": "AWS::Cognito::UserPoolGroup",
      "Properties": {
        "GroupName": "viewer",
        "UserPoolId": {
          "Ref": "UserPool"
        }
      }
    },
    "OperatorGroup": {
      "Type": "AWS::Cognito::UserPoolGroup",
      "Properties": {
        "GroupName": "operator",
        "UserPoolId": {
          "Ref": "UserPool"
        }
      }
    },
    "AdminGroup": {
      "Type": "AWS::Cognito::UserPoolGroup",
      "Properties": {
        "GroupName": "archive-admin",
        "UserPoolId": {
          "Ref": "UserPool"
        }
      }
    },
    "ServerRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ec2.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "ManagedPolicyArns": [
          {
            "Fn::Sub": "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
          }
        ],
        "Policies": [
          {
            "PolicyName": "StudyArchive",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:ListBucket",
                    "s3:GetBucketLocation"
                  ],
                  "Resource": {
                    "Fn::GetAtt": [
                      "ArchiveBucket",
                      "Arn"
                    ]
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject",
                    "s3:PutObject",
                    "s3:DeleteObject",
                    "s3:GetObjectTagging",
                    "s3:PutObjectTagging",
                    "s3:RestoreObject",
                    "s3:AbortMultipartUpload"
                  ],
                  "Resource": {
                    "Fn::Sub": "${ArchiveBucket.Arn}/*"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": "s3:GetObject",
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:s3:::${ArtifactBucket}/releases/*"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "logs:CreateLogStream",
                    "logs:PutLogEvents",
                    "logs:DescribeLogStreams"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/cloudtier-v2/*:*"
                  }
                }
              ]
            }
          }
        ]
      }
    },
    "ServerProfile": {
      "Type": "AWS::IAM::InstanceProfile",
      "Properties": {
        "Roles": [
          {
            "Ref": "ServerRole"
          }
        ]
      }
    },
    "ServerSecurityGroup": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "GroupDescription": "Only the Lambda gateway; administration through SSM",
        "VpcId": {
          "Ref": "VpcId"
        },
        "SecurityGroupIngress": [
          {
            "IpProtocol": "tcp",
            "FromPort": 80,
            "ToPort": 80,
            "SourceSecurityGroupId": {
              "Ref": "GatewaySecurityGroup"
            }
          }
        ],
        "SecurityGroupEgress": [
          {
            "IpProtocol": "-1",
            "CidrIp": "0.0.0.0/0"
          }
        ]
      }
    },
    "BootstrapLog": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": "/cloudtier-v2/bootstrap",
        "RetentionInDays": 14
      }
    },
    "NginxLog": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": "/cloudtier-v2/nginx",
        "RetentionInDays": 14
      }
    },
    "Server": {
      "Type": "AWS::EC2::Instance",
      "Properties": {
        "ImageId": {
          "Ref": "AmiId"
        },
        "InstanceType": {
          "Ref": "InstanceType"
        },
        "IamInstanceProfile": {
          "Ref": "ServerProfile"
        },
        "MetadataOptions": {
          "HttpTokens": "required",
          "HttpPutResponseHopLimit": 1
        },
        "NetworkInterfaces": [
          {
            "DeviceIndex": "0",
            "AssociatePublicIpAddress": true,
            "SubnetId": {
              "Ref": "SubnetId"
            },
            "GroupSet": [
              {
                "Ref": "ServerSecurityGroup"
              }
            ]
          }
        ],
        "BlockDeviceMappings": [
          {
            "DeviceName": "/dev/xvda",
            "Ebs": {
              "VolumeType": "gp3",
              "VolumeSize": 60,
              "Encrypted": true,
              "DeleteOnTermination": false
            }
          }
        ],
        "Tags": [
          {
            "Key": "Name",
            "Value": {
              "Fn::Sub": "${AWS::StackName}-study-server"
            }
          },
          {
            "Key": "Project",
            "Value": "CloudTierRecommender-v2"
          }
        ],
        "UserData": {
          "Fn::Base64": {
            "Fn::Sub": "#!/bin/bash\nset -euo pipefail\nmkdir -p /opt/cloudtier\naws s3 cp s3://${ArtifactBucket}/${ReleaseKey} /tmp/release.tgz --region ${AWS::Region}\ntar -xzf /tmp/release.tgz -C /opt/cloudtier\ncat > /etc/cloudtier.env <<'ENV'\nAWS_DEFAULT_REGION=${AWS::Region}\nARCHIVE_BUCKET=${ArchiveBucket}\nARCHIVE_DB_PATH=/var/lib/cloudtier/archive.db\nARCHIVE_DATA_DIR=/var/lib/cloudtier/files\nMRI_BUNDLE_DIR=/var/lib/cloudtier/model\nCOGNITO_USER_POOL_ID=${UserPool}\nCOGNITO_CLIENT_ID=${UserPoolClient}\nFRONTEND_DIR=/opt/cloudtier/src/frontend/dist\nHOME=/var/lib/cloudtier\nOMP_NUM_THREADS=2\nENV\nchmod 644 /etc/cloudtier.env\nbash /opt/cloudtier/aws/bootstrap.sh\n"
          }
        }
      },
      "DependsOn": [
        "BootstrapLog",
        "NginxLog"
      ]
    },
    "Alerts": {
      "Type": "AWS::SNS::Topic",
      "Properties": {}
    },
    "AlertSubscription": {
      "Type": "AWS::SNS::Subscription",
      "Properties": {
        "TopicArn": {
          "Ref": "Alerts"
        },
        "Protocol": "email",
        "Endpoint": {
          "Ref": "NotificationEmail"
        }
      },
      "Condition": "HasEmail"
    },
    "ServerAlarm": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "AlarmDescription": "Study server status check failed",
        "Namespace": "AWS/EC2",
        "MetricName": "StatusCheckFailed",
        "Dimensions": [
          {
            "Name": "InstanceId",
            "Value": {
              "Ref": "Server"
            }
          }
        ],
        "Statistic": "Maximum",
        "Period": 60,
        "EvaluationPeriods": 2,
        "Threshold": 1,
        "ComparisonOperator": "GreaterThanOrEqualToThreshold",
        "AlarmActions": [
          {
            "Ref": "Alerts"
          }
        ],
        "TreatMissingData": "notBreaching"
      }
    },
    "MonthlyBudget": {
      "Type": "AWS::Budgets::Budget",
      "Properties": {
        "Budget": {
          "BudgetName": {
            "Fn::Sub": "${AWS::StackName}-monthly"
          },
          "BudgetLimit": {
            "Amount": 100,
            "Unit": "USD"
          },
          "TimeUnit": "MONTHLY",
          "BudgetType": "COST"
        },
        "NotificationsWithSubscribers": {
          "Fn::If": [
            "HasEmail",
            [
              {
                "Notification": {
                  "NotificationType": "ACTUAL",
                  "ComparisonOperator": "GREATER_THAN",
                  "Threshold": 80,
                  "ThresholdType": "PERCENTAGE"
                },
                "Subscribers": [
                  {
                    "SubscriptionType": "EMAIL",
                    "Address": {
                      "Ref": "NotificationEmail"
                    }
                  }
                ]
              }
            ],
            {
              "Ref": "AWS::NoValue"
            }
          ]
        }
      }
    },
    "GatewaySecurityGroup": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "GroupDescription": "Lambda HTTPS gateway to study server",
        "VpcId": {
          "Ref": "VpcId"
        },
        "SecurityGroupEgress": [
          {
            "IpProtocol": "tcp",
            "FromPort": 80,
            "ToPort": 80,
            "CidrIp": "0.0.0.0/0"
          }
        ]
      }
    },
    "GatewayRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "ManagedPolicyArns": [
          {
            "Fn::Sub": "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
          }
        ]
      }
    },
    "Gateway": {
      "Type": "AWS::Lambda::Function",
      "Properties": {
        "Runtime": "python3.12",
        "Handler": "index.handler",
        "Role": {
          "Fn::GetAtt": [
            "GatewayRole",
            "Arn"
          ]
        },
        "Timeout": 130,
        "MemorySize": 256,
        "Code": {
          "ZipFile": "\"\"\"Small HTTPS Lambda URL gateway; source files upload directly to private S3.\"\"\"\nimport base64\nimport os\nimport urllib.error\nimport urllib.request\n\n\ndef handler(event, _context):\n    path = event.get(\"rawPath\", \"/\")\n    query = event.get(\"rawQueryString\", \"\")\n    url = \"http://\" + os.environ[\"SERVER_IP\"] + path + (\"?\" + query if query else \"\")\n    headers = {k: v for k, v in event.get(\"headers\", {}).items()\n               if k.lower() in (\"authorization\", \"content-type\", \"accept\", \"user-agent\")}\n    body = event.get(\"body\")\n    data = base64.b64decode(body) if body and event.get(\"isBase64Encoded\") else body.encode() if body else None\n    req = urllib.request.Request(url, data=data, headers=headers, method=event[\"requestContext\"][\"http\"][\"method\"])\n    try:\n        response = urllib.request.urlopen(req, timeout=120)\n    except urllib.error.HTTPError as error:\n        response = error\n    except (urllib.error.URLError, TimeoutError):\n        return {\"statusCode\": 503, \"headers\": {\"content-type\": \"application/json\", \"cache-control\": \"no-store\"},\n                \"body\": '{\"error\":{\"message\":\"The archive server is starting or unavailable. Try again shortly.\"}}'}\n    with response:\n        content = response.read(4 * 1024 * 1024 + 1)\n        if len(content) > 4 * 1024 * 1024:\n            return {\"statusCode\": 502, \"body\": \"Response too large for the pilot gateway\"}\n        return {\"statusCode\": response.status, \"headers\": {k: v for k, v in response.headers.items()\n                if k.lower() in (\"content-type\", \"cache-control\", \"x-content-type-options\", \"referrer-policy\", \"x-frame-options\")},\n                \"isBase64Encoded\": True, \"body\": base64.b64encode(content).decode()}\n"
        },
        "Environment": {
          "Variables": {
            "SERVER_IP": {
              "Fn::GetAtt": [
                "Server",
                "PrivateIp"
              ]
            }
          }
        },
        "VpcConfig": {
          "SubnetIds": [
            {
              "Ref": "SubnetId"
            }
          ],
          "SecurityGroupIds": [
            {
              "Ref": "GatewaySecurityGroup"
            }
          ]
        }
      }
    },
    "GatewayLog": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${Gateway}"
        },
        "RetentionInDays": 14
      }
    },
    "GatewayUrl": {
      "Type": "AWS::Lambda::Url",
      "Properties": {
        "TargetFunctionArn": {
          "Fn::GetAtt": [
            "Gateway",
            "Arn"
          ]
        },
        "AuthType": "NONE",
        "InvokeMode": "BUFFERED"
      }
    },
    "GatewayUrlPermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "FunctionName": {
          "Ref": "Gateway"
        },
        "Action": "lambda:InvokeFunctionUrl",
        "Principal": "*",
        "FunctionUrlAuthType": "NONE"
      }
    },
    "GatewayInvokePermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "FunctionName": {
          "Ref": "Gateway"
        },
        "Action": "lambda:InvokeFunction",
        "Principal": "*",
        "InvokedViaFunctionUrl": true
      }
    }
  },
  "Outputs": {
    "InstanceId": {
      "Value": {
        "Ref": "Server"
      }
    },
    "ArchiveBucketName": {
      "Value": {
        "Ref": "ArchiveBucket"
      }
    },
    "UserPoolId": {
      "Value": {
        "Ref": "UserPool"
      }
    },
    "UserPoolClientId": {
      "Value": {
        "Ref": "UserPoolClient"
      }
    },
    "FrontendUrl": {
      "Value": {
        "Fn::GetAtt": [
          "GatewayUrl",
          "FunctionUrl"
        ]
      }
    },
    "ApiUrl": {
      "Value": {
        "Fn::Sub": "${GatewayUrl.FunctionUrl}api"
      }
    },
    "GatewayFunctionName": {
      "Value": {
        "Ref": "Gateway"
      }
    }
  }
}
