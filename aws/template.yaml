AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Credential-ready Smart Storage Tier Recommender stack

Parameters:
  ProjectName:
    Type: String
    Default: smart-storage-tier
  AllowedOrigin:
    Type: String
    Default: '*'
  NotificationEmail:
    Type: String
    Default: ''

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, '']]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        TABLE_NAME: !Ref ScanTable
        AUDIT_TABLE_NAME: !Ref DecisionAuditTable
        CORS_ORIGIN: !Ref AllowedOrigin

Resources:
  ScanTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scan_id
          AttributeType: S
      KeySchema:
        - AttributeName: scan_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  DecisionAuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scan_id
          AttributeType: S
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: scan_id
          KeyType: HASH
        - AttributeName: event_id
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  AlertTopic:
    Type: AWS::SNS::Topic
  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail
  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic

  ImageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: RequestedStandardIA
            Status: Enabled
            TagFilters:
              - Key: tier
                Value: STANDARD_IA
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
          - Id: RequestedGlacier
            Status: Enabled
            TagFilters:
              - Key: tier
                Value: GLACIER
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 0
          - Id: RequestedDeepArchive
            Status: Enabled
            TagFilters:
              - Key: tier
                Value: DEEP_ARCHIVE
            Transitions:
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 0

  RestoreCompletedRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Restore Completed]
        detail:
          bucket:
            name: [!Ref ImageBucket]
      Targets:
        - Arn: !Ref AlertTopic
          Id: RestoreNotification

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${ProjectName}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${ProjectName}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
  ViewerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: viewer
      UserPoolId: !Ref UserPool
  ArchiveAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: archive-admin
      UserPoolId: !Ref UserPool
  OperatorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: operator
      UserPoolId: !Ref UserPool

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin: !Sub "'${AllowedOrigin}'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/api_handler/dist/
      Handler: handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ScanTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DecisionAuditTable
        - S3CrudPolicy:
            BucketName: !Ref ImageBucket
        - Statement:
            - Effect: Allow
              Action:
                - s3:RestoreObject
                - s3:GetObjectTagging
                - s3:PutObjectTagging
              Resource: !Sub ${ImageBucket.Arn}/*
      Events:
        ListScans: {Type: Api, Properties: {RestApiId: !Ref RestApi, Path: '/api/scans', Method: get}}
        ScanDetail: {Type: Api, Properties: {RestApiId: !Ref RestApi, Path: '/api/scans/{id}', Method: get}}
        Predict: {Type: Api, Properties: {RestApiId: !Ref RestApi, Path: '/api/scans/{id}/predict', Method: post}}
        OverrideTier: {Type: Api, Properties: {RestApiId: !Ref RestApi, Path: '/api/scans/{id}/tier', Method: post}}
        Restore: {Type: Api, Properties: {RestApiId: !Ref RestApi, Path: '/api/scans/{id}/restore', Method: post}}
        Costs: {Type: Api, Properties: {RestApiId: !Ref RestApi, Path: '/api/costs', Method: get}}
        Dashboard: {Type: Api, Properties: {RestApiId: !Ref RestApi, Path: '/api/dashboard/summary', Method: get}}

  InferenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/tier_inference/dist/
      Handler: handler.lambda_handler
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref AlertTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ScanTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DecisionAuditTable
        - S3CrudPolicy:
            BucketName: !Ref ImageBucket
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObjectTagging
                - s3:PutObjectTagging
              Resource: !Sub ${ImageBucket.Arn}/*
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertTopic.TopicName
        - Statement:
            - Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: '*'
      Events:
        ImageCreated:
          Type: S3
          Properties:
            Bucket: !Ref ImageBucket
            Events: s3:ObjectCreated:*
        ReconcileSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Enabled: true

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${ProjectName}-frontend-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendS3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOriginAccessControl
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

Outputs:
  ApiUrl:
    Value: !Sub https://${RestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod/api
  ImageBucketName: {Value: !Ref ImageBucket}
  ScanTableName: {Value: !Ref ScanTable}
  DecisionAuditTableName: {Value: !Ref DecisionAuditTable}
  UserPoolId: {Value: !Ref UserPool}
  UserPoolClientId: {Value: !Ref UserPoolClient}
  FrontendBucketName: {Value: !Ref FrontendBucket}
  FrontendDistributionId: {Value: !Ref FrontendDistribution}
  FrontendUrl:
    Value: !Sub https://${FrontendDistribution.DomainName}
